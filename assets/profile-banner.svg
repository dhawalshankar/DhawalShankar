<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Dhawal Shukla — backend engineer</title>
  <desc id="description">A dark banner with a swan mark, terminal illustration, and a focus on backend systems, developer tools, and Go.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c2c"/>
      <stop offset="0.58" stop-color="#0b111c"/>
      <stop offset="1" stop-color="#11111a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#61d6c6"/>
      <stop offset="1" stop-color="#83a9ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#376f88" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#376f88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8d5e8" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="760" cy="170" rx="430" ry="260" fill="url(#glow)"/>

  <path d="M0 316H1200" stroke="#b8d5e8" stroke-opacity="0.12"/>
  <path d="M0 317H1200" stroke="url(#accent)" stroke-opacity="0.42"/>

  <g transform="translate(72 111)" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 37c10-9 23-11 35-7 6 2 10 5 15 7-7 8-19 11-31 9-9-1-15-4-19-9Z" fill="#61d6c6" fill-opacity="0.18" stroke-width="2"/>
    <path d="M24 33c3-6 2-12-3-17-4-4-4-8 0-10 5-2 10 2 11 7 1 5-2 10-6 14 2 3 6 5 12 6" fill="none" stroke-width="3"/>
    <path d="m22 7-9 2 8 3" fill="#f4b87b" stroke="#f4b87b" stroke-width="1.5"/>
    <circle cx="25" cy="5" r="1.3" fill="#f3f6fb" stroke="none"/>
    <path d="M34 43c8 2 15 1 21-2" fill="none" stroke-opacity="0.65" stroke-width="1.5"/>
  </g>

  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="140" y="76" fill="#76d8c8" font-size="13" font-weight="700" letter-spacing="2.5">
      THE WITTY SWAN · ENGINEERING WITH INTENTION
    </text>
    <text x="140" y="150" fill="#f3f6fb" font-size="54" font-weight="750" letter-spacing="-1.5">
      Dhawal Shukla
    </text>
    <text x="140" y="199" fill="#c7d3e2" font-size="21">
      Backend systems. Developer tools. Useful software.
    </text>
    <text x="140" y="232" fill="#8f9db0" font-size="16">
      Go · Node.js · Python
    </text>

    <g transform="translate(140 264)">
      <rect width="92" height="28" rx="14" fill="#61d6c6" fill-opacity="0.12" stroke="#61d6c6" stroke-opacity="0.32"/>
      <text x="46" y="19" text-anchor="middle" fill="#9be6d9" font-size="12" font-weight="600">BACKEND</text>
      <rect x="104" width="104" height="28" rx="14" fill="#83a9ff" fill-opacity="0.1" stroke="#83a9ff" stroke-opacity="0.32"/>
      <text x="156" y="19" text-anchor="middle" fill="#b9cbff" font-size="12" font-weight="600">DEV TOOLS</text>
      <rect x="220" width="99" height="28" rx="14" fill="#f4b87b" fill-opacity="0.1" stroke="#f4b87b" stroke-opacity="0.32"/>
      <text x="269.5" y="19" text-anchor="middle" fill="#f4c99d" font-size="12" font-weight="600">COMMUNITY</text>
    </g>
  </g>

  <g transform="translate(762 52)">
    <rect width="370" height="258" rx="18" fill="#0b1019" fill-opacity="0.92" stroke="#d7e8f4" stroke-opacity="0.16"/>
    <path d="M0 54H370" stroke="#d7e8f4" stroke-opacity="0.12"/>
    <circle cx="25" cy="28" r="5" fill="#f27778"/>
    <circle cx="43" cy="28" r="5" fill="#e8bd70"/>
    <circle cx="61" cy="28" r="5" fill="#6ec7a3"/>
    <text x="87" y="32" fill="#77879c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
      ~/dhawal/build
    </text>

    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">
      <text x="28" y="91" fill="#7f91a8">$</text>
      <text x="45" y="91" fill="#dbe7f3">ship useful things</text>

      <text x="28" y="128" fill="#61d6c6">01</text>
      <text x="55" y="128" fill="#aebdd0">design clear service boundaries</text>

      <text x="28" y="165" fill="#61d6c6">02</text>
      <text x="55" y="165" fill="#aebdd0">make the safe path the easy path</text>

      <text x="28" y="202" fill="#61d6c6">03</text>
      <text x="55" y="202" fill="#aebdd0">learn in the open, build together</text>
    </g>

    <rect x="28" y="222" width="9" height="14" rx="2" fill="url(#accent)"/>
    <text x="48" y="234" fill="#77879c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">
      services ready
    </text>
    <path d="M263 230h18l7-9 10 16 8-7h34" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
  </g>

  <text x="72" y="339" fill="#718095" font-family="Inter, Segoe UI, sans-serif" font-size="11" letter-spacing="1.5">
    BUILD · LEARN · SHARE
  </text>
  <text x="1128" y="339" text-anchor="end" fill="#718095" font-family="Inter, Segoe UI, sans-serif" font-size="11">
    INDIA
  </text>
</svg>
