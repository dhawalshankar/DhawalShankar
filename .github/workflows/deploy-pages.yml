name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create temporary Jekyll config
        run: |
          cat << 'EOF' > _config.yml
          theme: jekyll-theme-primer
          plugins:
            - jekyll-readme-index
          readme_index:
            enabled: true
            remove_originals: true
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Hide default repo title & add Tic-Tac-Toe
        run: |
          sudo chown -R $USER:$USER _site
          sed -i 's|</head>|<style>header, .markdown-body > h1:first-child { display: none !important; }</style></head>|g' _site/index.html
          rm -rf _site/tic-tac-toe
          cp -r games/tic-tac-toe _site/tic-tac-toe
          cp swan.png _site/tic-tac-toe/swan.png


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
